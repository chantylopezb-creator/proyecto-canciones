<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Canciones Favoritas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-rosa { background-color: #f8c8dc; }
    </style>
    <style>
        .bg-morado { background-color: #d8c1f5; }
        .btn-morado { background-color: #d8c1f5; border-color: #d8c1f5; color: #212529; }
        .btn-morado:hover { background-color: #c8a8ef; border-color: #c8a8ef; color: #212529; }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">

                <div class="card shadow">
                    <div class="card-header bg-rosa text-dark text-center">
                        <h2>Lista de Canciones Favoritas</h2>
                    </div>

                    <div class="card-body">
                        <div class="mb-3">
                            <a href="/registro" class="btn btn-morado">Agregar canción</a>
                        </div>

                        <!-- Tabla de canciones -->
                        <table class="table table-striped table-hover border text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Canción</th>
                                    <th>Artista</th>
                                    <th>Álbum</th>
                                    <th>Género</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody>
                                {% for cancion in canciones %}
                                <tr>
                                    <td>{{ cancion.nombre }}</td>
                                    <td>{{ cancion.artista }}</td>
                                    <td>{{ cancion.album }}</td>
                                    <td>{{ cancion.genero }}</td>
                                    <td>
                                        <a href="/editar/{{ loop.index0 }}" class="btn btn-warning btn-sm">Editar</a>
                                        <a href="/eliminar/{{ loop.index0 }}" class="btn btn-danger btn-sm">Eliminar</a>
                                    </td>
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="5">Todavía no hay canciones agregadas.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
