<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Canción</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow">
                    <div class="card-header bg-warning text-dark text-center">
                        <h2>Editar Canción</h2>
                    </div>

                    <div class="card-body">
                        <form action="/actualizar/{{ id }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nombre de la canción</label>
                                <input type="text" name="nombre" class="form-control" value="{{ cancion.nombre }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Artista</label>
                                <input type="text" name="artista" class="form-control" value="{{ cancion.artista }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Álbum</label>
                                <input type="text" name="album" class="form-control" value="{{ cancion.album }}" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Género</label>
                                <input type="text" name="genero" class="form-control" value="{{ cancion.genero }}" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                                <a href="/" class="btn btn-secondary">Cancelar y Volver</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
